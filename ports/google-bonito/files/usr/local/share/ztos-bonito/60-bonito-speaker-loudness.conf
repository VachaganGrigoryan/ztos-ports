# Louder speaker, as Android does it: +8 dB of gain into a look-ahead limiter that keeps
# peaks under -1 dBFS, so quiet sounds get louder and loud ones don't clip. Needs swh-plugins.
# In front of it a high-pass, flat (20 Hz) until boosted: the bass this speaker can't play
# would only use up the limiter's headroom. Behind it a second limiter, at 0 dB until boosted.
# A WirePlumber smart filter: it sits only in front of the speaker sink, so headphones
# bypass it. Installed per user, in ~/.config/pipewire/pipewire.conf.d/, so that
# ztos-speaker-boost (the volume keys past 30) can set the gain and the high-pass.
# To switch the filter off, delete that copy and restart pipewire.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker loudness"
            media.name       = "Speaker loudness"
            filter.graph = {
                nodes = [
                    { type = builtin  name = hp_l  label = bq_highpass  control = { "Freq" = 20.0  "Q" = 0.707 } }
                    { type = builtin  name = hp_r  label = bq_highpass  control = { "Freq" = 20.0  "Q" = 0.707 } }
                    {   type    = ladspa
                        name    = limiter
                        plugin  = fast_lookahead_limiter_1913
                        label   = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 8.0  "Limit (dB)" = -1.0  "Release time (s)" = 0.08 }
                    }
                    {   type    = ladspa
                        name    = limiter2
                        plugin  = fast_lookahead_limiter_1913
                        label   = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0  "Limit (dB)" = -1.0  "Release time (s)" = 0.05 }
                    }
                ]
                links = [
                    { output = "hp_l:Out"  input = "limiter:Input 1" }
                    { output = "hp_r:Out"  input = "limiter:Input 2" }
                    { output = "limiter:Output 1"  input = "limiter2:Input 1" }
                    { output = "limiter:Output 2"  input = "limiter2:Input 2" }
                ]
                inputs  = [ "hp_l:In"  "hp_r:In" ]
                outputs = [ "limiter2:Output 1" "limiter2:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.speaker_loudness"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "bonito-speaker-loudness"
                filter.smart.target = { node.name = "alsa_output.platform-sound.VoiceCall__Speakers__sink" }
            }
            playback.props = {
                node.name    = "effect_output.speaker_loudness"
                node.passive = true
            }
        }
    }
]
