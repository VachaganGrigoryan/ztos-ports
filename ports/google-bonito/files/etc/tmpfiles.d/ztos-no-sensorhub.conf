# This phone has no Samsung sensor hub (/sys/class/sec/sensorhub). Without this mark, ztoscsf
# still checks for one 25 s after boot, and shows the "Sensor hub failed" dialog.
# It is the same mark the dialog's "stop the sensor hub" choice leaves for the rest of the boot.
f /run/ztoscsf-sensorhub.stopped 0644 root root -
