# Kernel 7.2.3 warns (mm/shrinker.c:212 set_shrinker_bit, from deferred_split_folio) when an
# app in a memory cgroup faults in a huge page with THP "always" (Waydroid, WPEWebProcess),
# and that cgroup's split queue may then not be shrunk. "madvise" keeps huge pages to
# programs that ask for them.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
