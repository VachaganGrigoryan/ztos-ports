# Louder speaker, as Android does it: +8 dB of gain into a look-ahead limiter that keeps
# peaks under -1 dBFS, so quiet sounds get louder and loud ones don't clip. Needs swh-plugins.
# A WirePlumber smart filter: it sits only in front of the speaker sink, so headphones
# bypass it. To switch it off, delete this file and restart pipewire.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker loudness"
            media.name       = "Speaker loudness"
            filter.graph = {
                nodes = [
                    {   type    = ladspa
                        name    = limiter
                        plugin  = fast_lookahead_limiter_1913
                        label   = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 8.0  "Limit (dB)" = -1.0  "Release time (s)" = 0.08 }
                    }
                ]
                inputs  = [ "limiter:Input 1"  "limiter:Input 2" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.speaker_loudness"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "bonito-speaker-loudness"
                filter.smart.target = { node.name = "alsa_output.platform-sound.VoiceCall__Speakers__sink" }
            }
            playback.props = {
                node.name    = "effect_output.speaker_loudness"
                node.passive = true
            }
        }
    }
]
